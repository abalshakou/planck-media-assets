<text x="72" y="96" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#6B655C">PLANCK MEDIA &#160;&#8226;&#160; МЕТОД</text>
<text x="72" y="190" font-size="58" font-weight="700" fill="#1C1A17">Может ли гравитация подавить</text>
<text x="72" y="264" font-size="58" font-weight="700" fill="#1C1A17">отталкивание квантового</text>
<text x="72" y="338" font-size="58" font-weight="700" fill="#1C1A17">вакуума?</text>
<text x="72" y="470" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6B655C">Флуктуации кривизны пространства-времени, обусловленные</text>
<text x="72" y="504" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6B655C">нелинейной природой гравитации, генерируют дополнительное</text>
<text x="72" y="538" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6B655C">гравитационное притяжение, которое может полностью…</text>
